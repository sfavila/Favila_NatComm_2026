# Exported from the lab's internal MGVS-release-2022 conda environment --
# see requirements.txt for why the pinned versions (nilearn==0.9.0 in
# particular) matter for reproducing the manuscript's reported numbers.
# Conda-level dependencies are trimmed to python/pip; everything else is
# installed via pip for cross-platform portability (the full `conda env
# export` also included several Linux-only low-level libraries).
name: mgvs-release
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8.11
  - pip
  - pip:
      - numpy==1.21.2
      - scipy==1.7.1
      - pandas==2.0.3
      - matplotlib==3.7.5
      - seaborn==0.13.2
      - statsmodels==0.13.2
      - pingouin==0.5.2
      - nibabel==3.2.1
      - nilearn==0.9.0
      - nbclient==0.5.4
      - nbformat==5.1.3
      - ipykernel==6.4.1
      - pytest==7.4.4
      - pyarrow==17.0.0
